<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><%= title %> | CSE Motors</title>

  <link rel="icon" type="image/png" href="/images/site/favicon-32x32.png">
  <link rel="stylesheet" href="/styles/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

  <meta name="description" content="CSE Motors - Your trusted source for quality vehicles and automotive services.">
  <meta property="og:title" content="CSE Motors">
  <meta property="og:description" content="Your trusted source for quality vehicles and automotive services.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#004080">
</head>

<body>
  <header id="top-header" class="container">
    <div class="branding">
      <a href="/" title="Return to home page">
        <img src="/images/icon.png" alt="CSE Motors logo" class="logo">
        <span class="site-name">CSE Motors</span>
      </a>
    </div>

    <nav aria-label="Main navigation">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </nav>

    <div id="tools">
      <a href="/account/login" title="Click to log in">My Account</a>
    </div>
  </header>

  <main>
    <section>
      <h2>Welcome to CSE Motors</h2>
      <p>Your trusted source for quality vehicles and automotive services.</p>
    </section>
  </main>

  <footer>
    <img src="/images/icon.png" alt="CSE Motors logo" class="footer-logo">
    <p>&copy; <%= new Date().getFullYear() %>, CSE 340 App</p>
    <ul class="footer-links">
      <li><a href="/about">About</a></li>
      <li><a href="/contact">Contact</a></li>
    </ul>
  </footer>

  <script src="/scripts/scripts.js"></script>
</body>
</html>
